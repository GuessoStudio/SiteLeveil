  <!-- Brevo form styles: lazy-loaded to avoid render-blocking -->
  <script>
    // Load Brevo fonts only when newsletter form is in viewport
    if ('IntersectionObserver' in window) {
      var brevoLoaded = false;
      var obs = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting && !brevoLoaded) {
          brevoLoaded = true;
          var s = document.createElement('style');
          s.textContent = '@font-face{font-display:swap;font-family:Roboto;src:url(https://assets.brevo.com/font/Roboto/Latin/normal/normal/7529907e9eaf8ebb5220c5f9850e3811.woff2) format("woff2")}@font-face{font-display:swap;font-family:Roboto;font-weight:600;src:url(https://assets.brevo.com/font/Roboto/Latin/medium/normal/6e9caeeafb1f3491be3e32744bc30440.woff2) format("woff2")}@font-face{font-display:swap;font-family:Roboto;font-weight:700;src:url(https://assets.brevo.com/font/Roboto/Latin/bold/normal/3ef7cf158f310cf752d5ad08cd0e7e60.woff2) format("woff2")}#sib-container input::placeholder{text-align:left;font-family:Helvetica,sans-serif;color:#c0ccda}#sib-container a{text-decoration:underline;color:#2BB2FC}';
          document.head.appendChild(s);
          obs.disconnect();
        }
      });
      // Observe the newsletter section once DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        var el = document.getElementById('newsletter') || document.querySelector('[name="newsletter"]');
        if (el) obs.observe(el);
      });
    }
  </script>
