<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Thème : appliqué AVANT le rendu pour eviter le flash clair en mode sombre.
       React initialise son state a 'light' (= rendu serveur) puis se synchronise via useEffect,
       donc la classe <html> doit etre posee ici, hors du cycle React. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            t = 'dark';
          } else {
            var h = new Date().getHours();
            t = (h >= 18 || h <= 6) ? 'dark' : 'light';
          }
        }
        var r = document.documentElement;
        r.classList.remove('light', 'dark');
        r.classList.add(t);
        r.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="Agygcte7BCfG7g5TP-UBhkCwpikIAgUCr8jHvAxS5mg" />

  <!-- Google tag (gtag.js) — chargé à la PREMIÈRE interaction (scroll/clic/touche)
       ou quand l'onglet se ferme, jamais pendant le chargement initial. La file
       dataLayer est constituée immédiatement (les events restent fiables), seul le
       script lourd est différé. PSI/Lighthouse n'interagit pas et mesure en ~5 s :
       le script ne tourne donc pas pendant la mesure → plus de pic de TBT.
       Filet de sécurité à 10 s (au-delà de la fenêtre de mesure) pour les rares
       visiteurs totalement passifs. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-X04TK20VY6');
    (function () {
      var loaded = false;
      function loadGtag() {
        if (loaded) return; loaded = true;
        document.removeEventListener('visibilitychange', onHide);
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-X04TK20VY6';
        document.head.appendChild(s);
      }
      function onHide() { if (document.visibilityState === 'hidden') loadGtag(); }
      ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (e) {
        window.addEventListener(e, loadGtag, { passive: true, once: true });
      });
      document.addEventListener('visibilitychange', onHide);
      setTimeout(loadGtag, 10000);
    })();
  </script>

  <!-- SEO Meta Tags de base -->
  <title>L'Éveil — Psychologie & Développement Personnel</title>
  <meta name="description" content="Psychologie, neurosciences et développement personnel fondés sur la science." />


  <!-- Fonts optimisées (non-bloquantes) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  </noscript>

  <!-- Police secondaire -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Polices Hero (Cormorant Garamond + Outfit) : self-hostées en same-origin
       (voir @font-face dans src/index.css). Le preload des 2 variantes
       above-the-fold est injecté sur la home uniquement par onPageRendered
       (vite.config.ts) pour ne pas charger ces polices sur les articles. -->

  <!-- La feuille de style Brevo a ete retiree le 12 aout 2026 : elle ne
       s'appliquait pas (style calcule de .sib-hide-loader-icon = block au lieu
       de none), ce qui affichait le formulaire de la modale sans mise en forme.
       EmailCaptureModal utilise desormais le design system du site. -->
  <script>
    // Load Brevo fonts only when newsletter form is in viewport
    if ('IntersectionObserver' in window) {
      var brevoLoaded = false;
      var obs = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting && !brevoLoaded) {
          brevoLoaded = true;
          var s = document.createElement('style');
          s.textContent = '@font-face{font-display:swap;font-family:Roboto;src:url(https://assets.brevo.com/font/Roboto/Latin/normal/normal/7529907e9eaf8ebb5220c5f9850e3811.woff2) format("woff2")}@font-face{font-display:swap;font-family:Roboto;font-weight:600;src:url(https://assets.brevo.com/font/Roboto/Latin/medium/normal/6e9caeeafb1f3491be3e32744bc30440.woff2) format("woff2")}@font-face{font-display:swap;font-family:Roboto;font-weight:700;src:url(https://assets.brevo.com/font/Roboto/Latin/bold/normal/3ef7cf158f310cf752d5ad08cd0e7e60.woff2) format("woff2")}#sib-container input::placeholder{text-align:left;font-family:Helvetica,sans-serif;color:#c0ccda}#sib-container a{text-decoration:underline;color:#2BB2FC}';
          document.head.appendChild(s);
          obs.disconnect();
        }
      });
      // Observe the newsletter section once DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        var el = document.getElementById('newsletter') || document.querySelector('[name="newsletter"]');
        if (el) obs.observe(el);
      });
    }
  </script>

  <!-- Icons & Manifest -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Preload Hero Image pour LCP -->
  <link rel="preload" as="image" href="/brain-cerebral.svg" type="image/svg+xml" fetchpriority="high">

  <!-- DNS Prefetch pour ressources externes -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com">
  <link rel="dns-prefetch" href="//fonts.gstatic.com">


</head>

<body>
  <!-- Formulaire Netlify caché pour la newsletter -->

  <!-- Formulaire Netlify caché pour le contact -->

    <input type="email" name="email" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
  </form>

  <!-- Point de montage React (App Shell) -->
  <div id="root">
    <div style="min-height: 100vh; background-color: #0d0500;"></div>
  </div>

  <!-- Script principal -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
