# Netlify Configuration for L'Éveil Mental

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Edge Functions
[[edge_functions]]
path = "/og"
function = "og"

# Headers
[[headers]]
  for = "/robots.txt"
  [headers.values]
  Cache-Control = "public, max-age=0, s-maxage=600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
  Cache-Control = "public, max-age=0, s-maxage=600"

# Catch-all géré dans public/_redirects (règles dans les deux fichiers créent des conflits)

# Security Headers — toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https:; font-src 'self' https://fonts.gstatic.com https:; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'none'; object-src 'none';"

