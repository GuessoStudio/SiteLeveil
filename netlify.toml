# Netlify Configuration for L'Éveil Mental

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Edge Functions
[[edge_functions]]
path = "/og"
function = "og"

# Headers
[[headers]]
  for = "/robots.txt"
  [headers.values]
  Cache-Control = "public, max-age=0, s-maxage=600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
  Cache-Control = "public, max-age=0, s-maxage=600"

# Catch-all redirect for React SPA (doit être en dernier)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
