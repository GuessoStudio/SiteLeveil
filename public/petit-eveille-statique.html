<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Le Petit Éveillé — personnage maître (animation-ready)</title>
<!--
  ============================================================================
  LE PETIT ÉVEILLÉ — SVG MASTER UNIQUE, structuré pour l'animation.
  ----------------------------------------------------------------------------
  - UN seul <svg id="petit-eveille"> inline (pas de <use>, pas de duplication).
  - Chaque pièce a un id unique ; les pièces liées sont dans des <g> logiques.
  - Les 3 ÉTATS (Émotions / Neurosciences / Éveil complet) ne sont PAS 3 dessins :
    ce sont 3 classes CSS posées sur #petit-eveille qui changent les opacités
    (spirales + glows). Boutons de test plus bas.
  - Ordre de rendu (= z-index) : jambes (arrière) -> bras -> torse -> tête ->
    soudure du cou (au-dessus, pour masquer le croisement épaules/tête).

  ANIMATION (CSS / JS / animateTransform / Rive) :
  - Pivots définis en CSS (transform-box + transform-origin) :
      * spirales  -> tournent autour de leur oeil exact (200,141) / (200,328)
      * head-group-> pivote au cou (tilt/nod naturel)
      * bras/jambes -> pivotent à l'épaule / la hanche
  - clipPath des spirales placés DANS leur groupe : une rotation tête/torse
    emmène la spirale ET son clip ensemble (pas de débordement).
  - #neck-junction est la SEULE frontière partagée tête<->torse. Elle suppose
    la tête au repos. Micro-anim (respiration, bob, rotation de spirale,
    changement d'état) -> OK. Forte rotation/inclinaison de tête -> ce raccord
    devra être retravaillé (deux pièces indépendantes partagent ce bord).
  - bubbles-head / bubbles-torso : groupes VIDES nommés, prêts à recevoir
    les bulles plus tard.
  ============================================================================
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0D0B1E; min-height: 100vh; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 40px 20px;
  }
  h1 { color: #A8A3C7; font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; }
  .stage { width: 100%; max-width: 420px; }
  #petit-eveille { width: 100%; height: auto; display: block; }

  /* ----- Pivots d'animation (origine de transform par pièce) ----- */
  #head-spiral  { transform-box: view-box; transform-origin: 200px 141px; }
  #torso-spiral { transform-box: view-box; transform-origin: 200px 328px; }
  #head-group   { transform-box: view-box; transform-origin: 200px 236px; } /* pivote au cou */
  #torso-group  { transform-box: view-box; transform-origin: 200px 330px; }
  #left-arm     { transform-box: view-box; transform-origin: 83px 305px; }  /* épaule G */
  #right-arm    { transform-box: view-box; transform-origin: 317px 305px; } /* épaule D */
  #left-leg     { transform-box: view-box; transform-origin: 157px 435px; } /* hanche G */
  #right-leg    { transform-box: view-box; transform-origin: 243px 435px; } /* hanche D */

  /* ----- Transitions douces entre états ----- */
  #head-spiral, #torso-spiral, #head-glow, #torso-glow { transition: opacity .6s ease; }

  /* ----- ÉTATS : classes posées sur #petit-eveille ----- */
  /* Émotions : spirale du torse dominante, tête atténuée */
  .mode-emotions #torso-spiral { opacity: 1; }
  .mode-emotions #torso-glow   { opacity: .9; }
  .mode-emotions #head-spiral  { opacity: .15; }
  .mode-emotions #head-glow    { opacity: .1; }
  /* Neurosciences : spirale de la tête dominante, torse atténué */
  .mode-neuro #torso-spiral { opacity: .15; }
  .mode-neuro #torso-glow   { opacity: .1; }
  .mode-neuro #head-spiral  { opacity: 1; }
  .mode-neuro #head-glow    { opacity: .9; }
  /* Éveil complet : les deux spirales et glows à pleine intensité */
  .mode-eveil #torso-spiral, .mode-eveil #head-spiral { opacity: 1; }
  .mode-eveil #torso-glow,   .mode-eveil #head-glow   { opacity: .9; }

  /* ----- DÉMO D'ANIMATION (togglable : classe .animate sur #petit-eveille) -----
     Preuve que la structure est animable. N'utilise QUE des transform (jamais
     opacity) pour ne pas entrer en conflit avec les opacités des états.
     - les deux spirales tournent en sens inverse (tête centripète <-> torse centrifuge)
     - tout le personnage (#character) respire doucement */
  @keyframes spin-cw  { to { transform: rotate(360deg); } }
  @keyframes spin-ccw { to { transform: rotate(-360deg); } }
  @keyframes breathe  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.012); } }
  .animate #head-spiral  { animation: spin-cw  28s linear infinite; }
  .animate #torso-spiral { animation: spin-ccw 34s linear infinite; }
  .animate #character    { animation: breathe   5s ease-in-out infinite; }
  #character { transform-box: view-box; transform-origin: 200px 360px; }
  @media (prefers-reduced-motion: reduce) {
    .animate #head-spiral, .animate #torso-spiral, .animate #character { animation: none; }
  }

  /* ----- Boutons de test des états ----- */
  .modes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .modes button {
    background: #1E1750; color: #fff; border: 1px solid #7C6FF7; border-radius: 999px;
    padding: 8px 16px; font-size: 12px; letter-spacing: .08em; cursor: pointer; transition: background .2s;
  }
  .modes button:hover, .modes button.active { background: #7C6FF7; }
  .modes .sep { width: 1px; background: #2A2350; margin: 2px 4px; }
</style>
</head>
<body>

<h1>Le Petit Éveillé — personnage maître</h1>

<div class="stage">
  <!-- ===================== SVG MASTER UNIQUE ===================== -->
  <svg id="petit-eveille" class="mode-eveil" viewBox="0 0 400 720"
       role="img" aria-label="Le Petit Éveillé : personnage monoligne avec une spirale dans la tête (cognition) et une spirale au plexus (émotions)">
    <defs>
      <!-- Halo radial des points d'ancrage (coeur blanc -> fondu) -->
      <radialGradient id="halo">
        <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.6"/>
        <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
        <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
      <!-- Clips : les spirales ne dépassent jamais de leur zone -->
      <clipPath id="clip-head-spiral"><circle cx="200" cy="141" r="84"/></clipPath>
      <clipPath id="clip-torso-spiral"><rect x="133" y="240" width="134" height="185" rx="40"/></clipPath>
      <!-- Masque du raccord du cou : exclut l'intérieur du fill de la tête -->
      <mask id="mask-neck">
        <rect x="0" y="0" width="400" height="720" fill="white"/>
        <circle cx="200" cy="141" r="89.5" fill="black"/>
      </mask>
    </defs>

    <!-- #character : enveloppe TOUT le personnage. Sert de poignée pour bouger
         ou faire respirer la silhouette entière sans la disloquer. -->
    <g id="character">

    <!-- ============ JAMBES (arrière) ============ -->
    <g id="legs-group">
      <path id="left-leg"  d="M127 413 L127 585 A 29.75 29.75 0 0 0 186.5 585 L186.5 453.5 A 13.5 13.5 0 0 1 200 440"
            fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
      <path id="right-leg" d="M273 413 L273 585 A 29.75 29.75 0 0 1 213.5 585 L213.5 453.5 A 13.5 13.5 0 0 0 200 440"
            fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- ============ BRAS ============ -->
    <g id="arms-group">
      <path id="left-arm"  d="M58 318 C56 352 60 395 70 421 A 19 19 0 0 0 108 418 L108 301.5 A 9.5 9.5 0 0 1 117.5 292"
            fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="right-arm" d="M342 318 C344 352 340 395 330 421 A 19 19 0 0 1 292 418 L292 301.5 A 9.5 9.5 0 0 0 282.5 292"
            fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ============ TORSE ============ -->
    <g id="torso-group">
      <!-- Contour : arche des épaules + deux flancs (avec demi-arches d'aisselle) -->
      <path id="torso-outline" d="M58 320 C58 258 108 222 200 222 C292 222 342 258 342 320
               M117.5 292 A 9.5 9.5 0 0 1 127 301.5 L127 433
               M282.5 292 A 9.5 9.5 0 0 0 273 301.5 L273 433"
            fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
      <!-- Spirale émotions (centrifuge), clippée DANS le groupe -->
      <g id="torso-spiral-clip" clip-path="url(#clip-torso-spiral)">
        <path id="torso-spiral" d="M200 328 L200.3 328.1 L200.6 328.2 L200.9 328.5 L201.1 328.8 L201.2 329.2 L201.2 329.6 L201.1 330.1 L200.8 330.5 L200.5 331 L200 331.3 L199.4 331.6 L198.8 331.8 L198 331.9 L197.3 331.8 L196.5 331.5 L195.7 331.1 L195 330.6 L194.3 329.9 L193.7 329 L193.3 328 L193.1 326.9 L193 325.7 L193.2 324.5 L193.5 323.3 L194.1 322.1 L194.9 321 L195.9 320 L197.1 319.1 L198.5 318.5 L200 318 L201.6 317.8 L203.3 317.9 L205 318.2 L206.7 318.8 L208.2 319.8 L209.7 320.9 L211 322.4 L212 324.1 L212.8 326 L213.3 328 L213.5 330.1 L213.3 332.3 L212.8 334.5 L211.9 336.6 L210.6 338.6 L209 340.4 L207.1 342 L204.9 343.2 L202.6 344.1 L200 344.7 L197.3 344.8 L194.6 344.5 L192 343.7 L189.4 342.6 L187 341 L184.9 339 L183.1 336.6 L181.6 334 L180.6 331.1 L180 328 L179.9 324.8 L180.3 321.6 L181.3 318.5 L182.7 315.5 L184.7 312.7 L187.1 310.2 L189.9 308.1 L193 306.4 L196.4 305.3 L200 304.7 L203.7 304.6 L207.4 305.2 L211 306.3 L214.5 308 L217.7 310.3 L220.5 313.1 L222.9 316.3 L224.7 320 L226 323.9 L226.7 328 L226.7 332.2 L226 336.4 L224.7 340.6 L222.7 344.5 L220 348 L216.8 351.2 L213.2 353.8 L209.1 355.9 L204.6 357.3 L200 358 L195.3 358 L190.5 357.2 L185.9 355.6 L181.6 353.3 L177.6 350.4 L174.1 346.8 L171.2 342.7 L168.9 338.1 L167.4 333.2 L166.7 328 L166.7 322.7 L167.7 317.5 L169.4 312.4 L172 307.6 L175.3 303.3 L179.2 299.4 L183.8 296.2 L188.9 293.8 L194.3 292.1 L200 291.3 L205.8 291.5 L211.5 292.5 L217.1 294.4 L222.3 297.3 L227.1 300.9 L231.3 305.3 L234.7 310.3 L237.4 315.8 L239.2 321.8 L240 328 L239.8 334.3 L238.7 340.6 L236.5 346.6 L233.4 352.3 L229.5 357.5 L224.7 362 L219.2 365.7 L213.2 368.6 L206.7 370.5 L200 371.3 L193.2 371.1 L186.4 369.8 L179.9 367.5 L173.7 364.1 L168.2 359.8 L163.3 354.6 L159.3 348.7 L156.3 342.2 L154.2 335.2 L153.3 328 L153.6 320.6 L155 313.4 L157.5 306.4 L161.2 299.8 L165.8 293.8 L171.4 288.6 L177.8 284.3 L184.8 281.1 L192.2 278.9 L200 278 L207.9 278.3 L215.7 279.8 L223.2 282.6 L230.2 286.5 L236.5 291.5 L242.1 297.4 L246.6 304.2 L250.1 311.7 L252.3 319.7 L253.3 328 L253 336.4 L251.4 344.7 L248.4 352.7 L244.2 360.1 L238.9 366.9 L232.5 372.8 L225.3 377.6 L217.3 381.3 L208.8 383.6 L200 384.7 L191.1 384.3 L182.3 382.5 L173.8 379.4 L165.9 374.9 L158.8 369.2 L152.5 362.5 L147.4 354.8 L143.6 346.3 L141.1 337.3 L140 328" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      </g>
      <!-- Coeur : halo + point net -->
      <g id="torso-core">
        <circle id="torso-glow" cx="200" cy="328" r="20" fill="url(#halo)"/>
        <circle id="torso-dot"  cx="200" cy="328" r="8"  fill="#FFFFFF"/>
      </g>
      <!-- Bulles du torse (à remplir plus tard) -->
      <g id="bubbles-torso"></g>
    </g>

    <!-- ============ TÊTE (devant) ============ -->
    <g id="head-group">
      <circle id="head-outline" cx="200" cy="141" r="95" fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11"/>
      <!-- Spirale cognition (centripète), clippée DANS le groupe -->
      <g id="head-spiral-clip" clip-path="url(#clip-head-spiral)">
        <path id="head-spiral" d="M200.0 207.0 L210.3 205.7 L220.1 202.9 L229.3 198.5 L237.7 192.9 L245.0 186.0 L251.1 178.1 L255.9 169.5 L259.2 160.2 L261.0 150.7 L261.3 141.0 L260.1 131.5 L257.4 122.4 L253.3 113.8 L248.1 106.1 L241.7 99.3 L234.4 93.7 L226.3 89.3 L217.8 86.3 L208.9 84.7 L200.0 84.4 L191.2 85.6 L182.8 88.1 L175.0 91.9 L167.9 96.8 L161.7 102.7 L156.5 109.4 L152.5 116.8 L149.8 124.7 L148.3 132.8 L148.1 141.0 L149.2 149.0 L151.6 156.7 L155.1 163.9 L159.6 170.4 L165.0 176.0 L171.2 180.7 L178.0 184.3 L185.1 186.7 L192.6 188.0 L200.0 188.1 L207.3 187.1 L214.3 184.9 L220.8 181.7 L226.6 177.6 L231.7 172.7 L235.9 167.0 L239.1 160.9 L241.2 154.4 L242.4 147.7 L242.4 141.0 L241.4 134.4 L239.5 128.2 L236.5 122.4 L232.8 117.2 L228.3 112.7 L223.3 109.0 L217.8 106.1 L211.9 104.2 L206.0 103.3 L200.0 103.3 L194.2 104.2 L188.6 106.0 L183.5 108.7 L178.9 112.0 L175.0 116.0 L171.8 120.5 L169.3 125.4 L167.7 130.5 L166.9 135.8 L167.0 141.0 L167.9 146.1 L169.5 150.9 L171.9 155.3 L174.8 159.3 L178.3 162.7 L182.3 165.4 L186.5 167.5 L191.0 168.8 L195.5 169.4 L200.0 169.3 L204.4 168.5 L208.4 167.0 L212.2 164.9 L215.5 162.4 L218.3 159.3 L220.6 156.0 L222.3 152.3 L223.3 148.6 L223.7 144.8 L223.6 141.0 L222.8 137.4 L221.5 134.0 L219.7 130.9 L217.5 128.3 L215.0 126.0 L212.2 124.2 L209.2 122.9 L206.1 122.2 L203.0 121.9 L200.0 122.1 L197.1 122.8 L194.5 124.0 L192.1 125.5 L190.0 127.3 L188.3 129.3 L187.0 131.6 L186.1 133.9 L185.7 136.3 L185.6 138.7 L185.9 141.0 L186.5 143.1 L187.4 145.1 L188.7 146.8 L190.1 148.2 L191.7 149.3 L193.3 150.2 L195.1 150.7 L196.8 150.9 L198.5 150.8 L200.0 150.4 L201.4 149.8 L202.6 149.1 L203.6 148.1 L204.4 147.1 L205.0 146.0 L205.3 144.9 L205.5 143.8 L205.4 142.7 L205.1 141.8 L204.7 141.0 L204.2 140.3 L203.6 139.8 L202.9 139.5 L202.3 139.3 L201.7 139.3 L201.1 139.5 L200.6 139.7 L200.3 140.1 L200.1 140.5 L200.0 141.0" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      </g>
      <!-- Coeur : halo + point net -->
      <g id="head-core">
        <circle id="head-glow" cx="200" cy="141" r="24" fill="url(#halo)"/>
        <circle id="head-dot"  cx="200" cy="141" r="8"  fill="#FFFFFF"/>
      </g>
      <!-- Bulles de la tête (à remplir plus tard) -->
      <g id="bubbles-head"></g>
    </g>

    <!-- ============ RACCORD DU COU (au-dessus) ============
         Redessine l'arche des épaules par-dessus la tête, masquée pour ne
         jamais entrer dans le cercle : comble les triangles sombres du
         croisement sans bosse. Frontière partagée tête<->torse (voir entête). -->
    <g id="neck-junction" mask="url(#mask-neck)">
      <path d="M58 320 C58 258 108 222 200 222 C292 222 342 258 342 320"
            fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    </g>

    </g><!-- /#character -->
  </svg>
</div>

<!-- ===================== BOUTONS DE TEST ===================== -->
<div class="modes" role="group" aria-label="Tester les états et l'animation">
  <button data-mode="mode-emotions">Émotions</button>
  <button data-mode="mode-neuro">Neurosciences</button>
  <button data-mode="mode-eveil" class="active">Éveil complet</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="toggle-anim" type="button" aria-pressed="false">Animation ▶</button>
</div>

<script>
  (function () {
    var svg = document.getElementById('petit-eveille');

    // Bascule des états (Émotions / Neurosciences / Éveil complet)
    var modeBtns = document.querySelectorAll('.modes button[data-mode]');
    modeBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        svg.classList.remove('mode-emotions', 'mode-neuro', 'mode-eveil');
        svg.classList.add(b.dataset.mode);
        modeBtns.forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
      });
    });

    // Démo d'animation on/off (classe .animate)
    var anim = document.getElementById('toggle-anim');
    anim.addEventListener('click', function () {
      var on = svg.classList.toggle('animate');
      anim.classList.toggle('active', on);
      anim.setAttribute('aria-pressed', String(on));
      anim.textContent = on ? 'Animation ⏸' : 'Animation ▶';
    });
  })();
</script>

</body>
</html>
