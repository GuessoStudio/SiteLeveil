<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Le Petit Éveillé — Planche statique de validation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0D0B1E; min-height: 100vh; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 32px;
  }
  h1 {
    color: #A8A3C7;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .planche {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    width: 100%;
    max-width: 1200px;
  }
  figure {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1 1 280px;
    max-width: 380px;
  }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption {
    color: #A8A3C7;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<h1>Le Petit Éveillé — version statique</h1>

    <path id="spirale-torse" d="M200.0 390.0 L200.0 390.4 L200.2 390.7 L200.4 391.0 L200.7 391.3 L201.0 391.5 L201.5 391.7 L201.9 391.7 L202.4 391.7 L202.9 391.6 L203.4 391.3 L203.9 391.0 L204.4 390.6 L204.8 390.1 L205.1 389.4 L205.4 388.7 L205.6 388.0 L205.6 387.2 L205.5 386.3 L205.3 385.4 L205.0 384.6 L204.5 383.7 L203.9 382.9 L203.2 382.1 L202.3 381.4 L201.3 380.9 L200.2 380.4 L199.0 380.1 L197.8 379.9 L196.4 379.9 L195.1 380.1 L193.7 380.4 L192.4 381.0 L191.1 381.7 L189.9 382.6 L188.7 383.7 L187.7 384.9 L186.8 386.3 L186.1 387.9 L185.6 389.5 L185.3 391.3 L185.2 393.1 L185.3 395.0 L185.7 396.9 L186.3 398.7 L187.2 400.5 L188.3 402.3 L189.6 403.9 L191.1 405.4 L192.9 406.6 L194.8 407.7 L196.9 408.6 L199.2 409.2 L201.5 409.5 L203.9 409.6 L206.3 409.3 L208.7 408.7 L211.1 407.9 L213.4 406.7 L215.6 405.2 L217.6 403.5 L219.4 401.5 L221.0 399.2 L222.3 396.7 L223.3 394.1 L224.0 391.3 L224.3 388.4 L224.3 385.4 L223.9 382.4 L223.2 379.5 L222.1 376.6 L220.6 373.8 L218.8 371.2 L216.6 368.8 L214.2 366.6 L211.4 364.8 L208.4 363.2 L205.2 362.1 L201.9 361.3 L198.4 360.9 L194.9 360.9 L191.3 361.4 L187.8 362.3 L184.4 363.6 L181.1 365.4 L178.0 367.6 L175.2 370.1 L172.7 373.1 L170.5 376.3 L168.8 379.8 L167.4 383.5 L166.5 387.5 L166.1 391.5 L166.1 395.6 L166.7 399.7 L167.8 403.8 L169.3 407.7 L171.4 411.5 L173.9 415.0 L176.8 418.3 L180.2 421.2 L183.9 423.6 L187.9 425.7 L192.2 427.2 L196.7 428.3 L201.3 428.7 L206.0 428.7 L210.7 428.0 L215.3 426.8 L219.8 425.1 L224.0 422.7 L228.0 419.9 L231.7 416.6 L235.0 412.8 L237.8 408.6 L240.1 404.0 L241.8 399.2 L243.0 394.2 L243.6 389.0 L243.5 383.7 L242.8 378.5 L241.4 373.3 L239.5 368.3 L236.9 363.5 L233.7 359.0 L230.0 354.9 L225.8 351.3 L221.2 348.1 L216.1 345.6 L210.8 343.6 L205.2 342.3 L199.4 341.6 L193.6 341.7 L187.8 342.4 L182.0 343.9 L176.5 346.1 L171.1 348.9 L166.2 352.4 L161.7 356.4 L157.6 361.1 L154.1 366.2 L151.3 371.7 L149.1 377.6 L147.6 383.7 L146.8 390.1 L146.9 396.5 L147.7 402.9 L149.2 409.2 L151.6 415.3 L154.6 421.1 L158.4 426.6 L162.8 431.6 L167.9 436.0 L173.4 439.9 L179.5 443.0 L185.9 445.5 L192.6 447.1 L199.4 448.0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

    <!-- Clips : les spirales ne dépassent jamais des contours -->
    <clipPath id="clip-tete"><circle cx="200" cy="155" r="83"/></clipPath>
    <clipPath id="clip-torse"><rect x="121" y="234" width="158" height="277" rx="52"/></clipPath>

    <!-- Glow léger du point d'ancrage -->
    <filter id="glow-doux" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- Silhouette commune : jambes + bras dessinés sous le corps,
         corps et tête remplis du fond pour des jonctions propres (pas de cou) -->
    <g id="jambes">
      <rect x="136" y="478" width="44" height="122" rx="22" fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11"/>
      <rect x="220" y="478" width="44" height="122" rx="22" fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11"/>
    </g>
    <g id="bras-neutres" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
      <path d="M118 272 Q96 322 94 386"/>
      <path d="M282 272 Q304 322 306 386"/>
    </g>
    <g id="bras-ouverts" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
      <path d="M120 268 Q82 302 58 372"/>
      <path d="M280 268 Q318 302 342 372"/>
    </g>
    <g id="corps-et-tete">
      <rect x="112" y="225" width="176" height="295" rx="62" fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11"/>
      <circle cx="200" cy="155" r="92" fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11"/>
    </g>

    <!-- Bulles -->
    <g id="bulles-torse" fill="#FFFFFF">
      <circle cx="86" cy="332" r="3.5"/>
      <circle cx="72" cy="412" r="4.5"/>
      <circle cx="94" cy="468" r="2.5"/>
      <circle cx="314" cy="348" r="4"/>
      <circle cx="328" cy="428" r="3"/>
      <circle cx="302" cy="486" r="2"/>
    </g>
    <g id="bulles-tete" fill="#FFFFFF">
      <circle cx="106" cy="82" r="3.5"/>
      <circle cx="88" cy="142" r="2.5"/>
      <circle cx="134" cy="38" r="2"/>
      <circle cx="288" cy="56" r="4"/>
      <circle cx="314" cy="128" r="3"/>
      <circle cx="266" cy="26" r="2.5"/>
    </g>
  </defs>
</svg>

<div class="planche">

  <!-- ===================== MODE ÉMOTIONS ===================== -->
  <figure>
    <svg viewBox="0 0 400 720" role="img" aria-label="Le Petit Éveillé, mode Émotions : spirale du torse dominante">
      <g transform="translate(0,30)">
        <use href="#jambes"/>
        <use href="#bras-neutres"/>
        <use href="#corps-et-tete"/>

        <!-- Spirale torse : dominante -->
        <g clip-path="url(#clip-torse)">
          <use href="#spirale-torse" opacity="1"/>
        </g>
        <!-- Spirale tête : atténuée -->
        <g clip-path="url(#clip-tete)">
          <use href="#spirale-tete" opacity="0.15"/>
        </g>

        <!-- Points d'ancrage (toujours présents) -->
        <circle cx="200" cy="390" r="11" fill="#FFFFFF" opacity="0.85" filter="url(#glow-doux)"/>
        <circle cx="200" cy="390" r="5.5" fill="#FFFFFF"/>
        <circle cx="200" cy="155" r="11" fill="#FFFFFF" opacity="0.1" filter="url(#glow-doux)"/>
        <circle cx="200" cy="155" r="5.5" fill="#FFFFFF"/>

        <use href="#bulles-torse" opacity="0.75"/>
      </g>
    </svg>
    <figcaption>Émotions</figcaption>
  </figure>

  <!-- =================== MODE NEUROSCIENCES =================== -->
  <figure>
    <svg viewBox="0 0 400 720" role="img" aria-label="Le Petit Éveillé, mode Neurosciences : spirale de la tête dominante">
      <g transform="translate(0,30)">
        <use href="#jambes"/>
        <use href="#bras-neutres"/>
        <use href="#corps-et-tete"/>

        <!-- Spirale torse : atténuée -->
        <g clip-path="url(#clip-torse)">
          <use href="#spirale-torse" opacity="0.15"/>
        </g>
        <!-- Spirale tête : dominante -->
        <g clip-path="url(#clip-tete)">
          <use href="#spirale-tete" opacity="1"/>
        </g>

        <!-- Points d'ancrage (toujours présents) -->
        <circle cx="200" cy="390" r="11" fill="#FFFFFF" opacity="0.1" filter="url(#glow-doux)"/>
        <circle cx="200" cy="390" r="5.5" fill="#FFFFFF"/>
        <circle cx="200" cy="155" r="11" fill="#FFFFFF" opacity="0.85" filter="url(#glow-doux)"/>
        <circle cx="200" cy="155" r="5.5" fill="#FFFFFF"/>

        <use href="#bulles-tete" opacity="0.75"/>
      </g>
    </svg>
    <figcaption>Neurosciences</figcaption>
  </figure>

  <!-- =================== MODE ÉVEIL COMPLET =================== -->
  <figure>
    <svg viewBox="0 0 400 720" role="img" aria-label="Le Petit Éveillé, mode Éveil complet : les deux spirales équilibrées, bras ouverts">
      <g transform="translate(0,30)">
        <use href="#jambes"/>
        <use href="#bras-ouverts"/>
        <use href="#corps-et-tete"/>

        <!-- Les deux spirales équilibrées -->
        <g clip-path="url(#clip-torse)">
          <use href="#spirale-torse" opacity="1"/>
        </g>
        <g clip-path="url(#clip-tete)">
          <use href="#spirale-tete" opacity="1"/>
        </g>

        <!-- Points d'ancrage, les deux glows actifs -->
        <circle cx="200" cy="390" r="11" fill="#FFFFFF" opacity="0.85" filter="url(#glow-doux)"/>
        <circle cx="200" cy="390" r="5.5" fill="#FFFFFF"/>
        <circle cx="200" cy="155" r="11" fill="#FFFFFF" opacity="0.85" filter="url(#glow-doux)"/>
        <circle cx="200" cy="155" r="5.5" fill="#FFFFFF"/>

        <!-- Bulles légères autour des deux zones -->
        <g opacity="0.5">
          <circle cx="106" cy="82" r="3.5" fill="#FFFFFF"/>
          <circle cx="288" cy="56" r="4" fill="#FFFFFF"/>
          <circle cx="314" cy="128" r="3" fill="#FFFFFF"/>
          <circle cx="86" cy="332" r="3.5" fill="#FFFFFF"/>
          <circle cx="72" cy="412" r="4.5" fill="#FFFFFF"/>
          <circle cx="314" cy="348" r="4" fill="#FFFFFF"/>
        </g>
      </g>
    </svg>
    <figcaption>Éveil Complet</figcaption>
  </figure>

</div>

</body>
</html>
