<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Le Petit Éveillé — Planche statique de validation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0D0B1E; min-height: 100vh; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 32px;
  }
  h1 {
    color: #A8A3C7;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .planche {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    width: 100%;
    max-width: 1200px;
  }
  figure {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1 1 280px;
    max-width: 380px;
  }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption {
    color: #A8A3C7;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<h1>Le Petit Éveillé — version statique</h1>

<!-- ============================================================
     DÉFINITIONS PARTAGÉES
     Silhouette d'après références : grande tête (~37 % de la hauteur),
     corps compact d'un seul bloc, bras intégrés au contour (lignes
     intérieures), jambes marquées par la ligne de séparation centrale.
     Spirales d'Archimède (r = b·θ) générées mathématiquement.
     Tête  : 2,25 tours, rayon max 66, tracé centripète
             (le path démarre à l'extérieur et se resserre vers le centre).
     Torse : 2,25 tours, rayon max 52, tracé centrifuge, sens inverse
             (le path démarre au centre et rayonne vers l'extérieur).
     ============================================================ -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <!-- Spirale cognition (tête) -->
    <path id="spirale-tete" d="M265.2 198.6 L263.5 191.0 L260.8 183.7 L257.3 176.8 L253.1 170.5 L248.1 164.7 L242.6 159.7 L236.5 155.3 L230.0 151.8 L223.2 149.1 L216.2 147.3 L209.1 146.3 L202.0 146.2 L195.0 147.0 L188.2 148.5 L181.7 150.9 L175.6 154.0 L169.9 157.7 L164.9 162.1 L160.4 167.0 L156.6 172.4 L153.4 178.1 L151.1 184.1 L149.5 190.2 L148.6 196.5 L148.5 202.7 L149.2 208.8 L150.5 214.8 L152.6 220.5 L155.3 225.8 L158.6 230.7 L162.4 235.1 L166.7 239.0 L171.3 242.3 L176.3 245.0 L181.5 247.0 L186.8 248.4 L192.2 249.1 L197.6 249.2 L202.8 248.6 L207.9 247.4 L212.8 245.6 L217.3 243.3 L221.5 240.5 L225.2 237.2 L228.5 233.5 L231.3 229.6 L233.5 225.4 L235.2 221.0 L236.3 216.5 L236.9 211.9 L236.9 207.4 L236.4 203.0 L235.3 198.8 L233.8 194.8 L231.8 191.0 L229.4 187.6 L226.7 184.6 L223.6 181.9 L220.4 179.7 L216.9 177.9 L213.3 176.6 L209.6 175.7 L205.9 175.3 L202.3 175.4 L198.7 175.9 L195.4 176.8 L192.2 178.1 L189.2 179.8 L186.6 181.7 L184.2 183.9 L182.2 186.4 L180.5 189.0 L179.2 191.7 L178.3 194.6 L177.7 197.4 L177.5 200.3 L177.7 203.0 L178.2 205.7 L179.0 208.2 L180.0 210.6 L181.4 212.7 L182.9 214.6 L184.6 216.3 L186.5 217.6 L188.5 218.7 L190.5 219.5 L192.6 220.1 L194.6 220.3 L196.6 220.3 L198.5 220.1 L200.3 219.6 L202.0 218.9 L203.5 218.0 L204.8 217.0 L205.9 215.8 L206.9 214.6 L207.6 213.3 L208.1 211.9 L208.4 210.6 L208.5 209.3 L208.4 208.1 L208.2 206.9 L207.8 205.9 L207.3 204.9 L206.7 204.1 L206.0 203.5 L205.2 203.0 L204.4 202.6 L203.7 202.4 L202.9 202.4 L202.2 202.5 L201.6 202.7 L201.0 203.0 L200.6 203.4 L200.3 203.9 L200.1 204.4 L200.0 205.0" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <!-- Spirale émotions (torse) -->
    <path id="spirale-torse" d="M200.0 418.0 L200.1 418.4 L200.2 418.9 L200.5 419.2 L200.8 419.6 L201.2 419.8 L201.7 420.0 L202.3 420.1 L202.9 420.0 L203.5 419.9 L204.1 419.6 L204.7 419.2 L205.3 418.7 L205.7 418.1 L206.1 417.3 L206.4 416.5 L206.6 415.6 L206.7 414.6 L206.6 413.6 L206.4 412.5 L206.0 411.5 L205.4 410.5 L204.7 409.5 L203.8 408.6 L202.7 407.8 L201.6 407.1 L200.2 406.5 L198.8 406.1 L197.3 405.9 L195.8 405.9 L194.1 406.1 L192.5 406.5 L190.9 407.2 L189.4 408.0 L187.9 409.1 L186.5 410.4 L185.3 411.9 L184.3 413.6 L183.4 415.5 L182.8 417.4 L182.4 419.5 L182.3 421.7 L182.4 424.0 L182.9 426.2 L183.6 428.4 L184.7 430.6 L186.0 432.7 L187.6 434.6 L189.4 436.4 L191.5 437.9 L193.8 439.2 L196.3 440.2 L199.0 440.9 L201.8 441.3 L204.7 441.4 L207.6 441.1 L210.5 440.4 L213.3 439.4 L216.0 438.0 L218.6 436.2 L221.0 434.1 L223.2 431.7 L225.1 429.0 L226.6 426.1 L227.8 422.9 L228.6 419.5 L229.1 416.1 L229.1 412.5 L228.6 409.0 L227.7 405.4 L226.4 402.0 L224.6 398.6 L222.5 395.5 L219.9 392.6 L216.9 390.1 L213.6 387.8 L210.1 386.0 L206.2 384.6 L202.2 383.6 L198.1 383.2 L193.8 383.2 L189.6 383.8 L185.4 384.9 L181.3 386.5 L177.4 388.6 L173.7 391.2 L170.4 394.3 L167.4 397.7 L164.8 401.6 L162.7 405.8 L161.0 410.3 L159.9 415.0 L159.4 419.8 L159.5 424.7 L160.2 429.6 L161.5 434.5 L163.3 439.2 L165.8 443.7 L168.8 447.9 L172.3 451.8 L176.3 455.2 L180.8 458.2 L185.6 460.6 L190.7 462.5 L196.0 463.7 L201.6 464.3 L207.2 464.2 L212.8 463.5 L218.3 462.0 L223.6 459.9 L228.7 457.1 L233.5 453.7 L237.9 449.7 L241.8 445.2 L245.2 440.2 L247.9 434.8 L250.0 429.0 L251.4 423.0" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

    <!-- Clips : les spirales ne dépassent jamais des contours -->
    <clipPath id="clip-tete"><circle cx="200" cy="205" r="90"/></clipPath>
    <clipPath id="clip-torse"><rect x="141" y="315" width="118" height="205" rx="24"/></clipPath>

    <!-- Glow léger du point d'ancrage -->
    <filter id="glow-doux" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- Corps : bloc compact unique (les bras émergent du contour),
         tête large posée directement dessus (pas de cou).
         Corps et tête remplis du fond pour des jonctions propres. -->
    <g id="corps-et-tete">
      <!-- Épaules très arrondies (r 58), coins inférieurs plus serrés (r 36) -->
      <path d="M142 295 H258 A58 58 0 0 1 316 353 V609 A36 36 0 0 1 280 645 H120 A36 36 0 0 1 84 609 V353 A58 58 0 0 1 142 295 Z"
            fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11"/>
      <circle cx="200" cy="205" r="100" fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11"/>
    </g>

    <!-- Bras intégrés : lignes intérieures séparant les bras du torse -->
    <g id="bras-integres" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
      <line x1="134" y1="342" x2="134" y2="484"/>
      <line x1="266" y1="342" x2="266" y2="484"/>
    </g>

    <!-- Jambes : ligne de séparation centrale (réf. : pas de jambes détachées) -->
    <line id="jambes-separation" x1="200" y1="645" x2="200" y2="532" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>

    <!-- Bras ouverts (variante expressivité) : capsules pivotées ~28°,
         dessinées sous le corps pour une jonction propre à l'épaule -->
    <g id="bras-ouverts">
      <g transform="translate(100,330) rotate(26)">
        <rect x="-22" y="-10" width="44" height="170" rx="22" fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11"/>
      </g>
      <g transform="translate(300,330) rotate(-26)">
        <rect x="-22" y="-10" width="44" height="170" rx="22" fill="#0D0B1E" stroke="#FFFFFF" stroke-width="11"/>
      </g>
    </g>

    <!-- Bulles -->
    <g id="bulles-torse" fill="#FFFFFF">
      <circle cx="62" cy="360" r="3.5"/>
      <circle cx="48" cy="440" r="4.5"/>
      <circle cx="66" cy="510" r="2.5"/>
      <circle cx="338" cy="375" r="4"/>
      <circle cx="352" cy="455" r="3"/>
      <circle cx="330" cy="520" r="2"/>
    </g>
    <g id="bulles-tete" fill="#FFFFFF">
      <circle cx="96" cy="130" r="3.5"/>
      <circle cx="78" cy="195" r="2.5"/>
      <circle cx="124" cy="82" r="2"/>
      <circle cx="290" cy="98" r="4"/>
      <circle cx="322" cy="175" r="3"/>
      <circle cx="262" cy="66" r="2.5"/>
    </g>
  </defs>
</svg>

<div class="planche">

  <!-- ===================== MODE ÉMOTIONS ===================== -->
  <figure>
    <svg viewBox="0 0 400 720" role="img" aria-label="Le Petit Éveillé, mode Émotions : spirale du torse dominante">
      <use href="#corps-et-tete"/>
      <use href="#bras-integres"/>
      <use href="#jambes-separation"/>

      <!-- Spirale torse : dominante -->
      <g clip-path="url(#clip-torse)">
        <use href="#spirale-torse" opacity="1"/>
      </g>
      <!-- Spirale tête : atténuée -->
      <g clip-path="url(#clip-tete)">
        <use href="#spirale-tete" opacity="0.15"/>
      </g>

      <!-- Points d'ancrage (toujours présents) -->
      <circle cx="200" cy="418" r="11" fill="#FFFFFF" opacity="0.85" filter="url(#glow-doux)"/>
      <circle cx="200" cy="418" r="6" fill="#FFFFFF"/>
      <circle cx="200" cy="205" r="11" fill="#FFFFFF" opacity="0.1" filter="url(#glow-doux)"/>
      <circle cx="200" cy="205" r="6" fill="#FFFFFF"/>

      <use href="#bulles-torse" opacity="0.75"/>
    </svg>
    <figcaption>Émotions</figcaption>
  </figure>

  <!-- =================== MODE NEUROSCIENCES =================== -->
  <figure>
    <svg viewBox="0 0 400 720" role="img" aria-label="Le Petit Éveillé, mode Neurosciences : spirale de la tête dominante">
      <use href="#corps-et-tete"/>
      <use href="#bras-integres"/>
      <use href="#jambes-separation"/>

      <!-- Spirale torse : atténuée -->
      <g clip-path="url(#clip-torse)">
        <use href="#spirale-torse" opacity="0.15"/>
      </g>
      <!-- Spirale tête : dominante -->
      <g clip-path="url(#clip-tete)">
        <use href="#spirale-tete" opacity="1"/>
      </g>

      <!-- Points d'ancrage (toujours présents) -->
      <circle cx="200" cy="418" r="11" fill="#FFFFFF" opacity="0.1" filter="url(#glow-doux)"/>
      <circle cx="200" cy="418" r="6" fill="#FFFFFF"/>
      <circle cx="200" cy="205" r="11" fill="#FFFFFF" opacity="0.85" filter="url(#glow-doux)"/>
      <circle cx="200" cy="205" r="6" fill="#FFFFFF"/>

      <use href="#bulles-tete" opacity="0.75"/>
    </svg>
    <figcaption>Neurosciences</figcaption>
  </figure>

  <!-- =================== MODE ÉVEIL COMPLET =================== -->
  <figure>
    <svg viewBox="0 0 400 720" role="img" aria-label="Le Petit Éveillé, mode Éveil complet : les deux spirales équilibrées, bras ouverts">
      <use href="#bras-ouverts"/>
      <use href="#corps-et-tete"/>
      <use href="#jambes-separation"/>

      <!-- Les deux spirales équilibrées -->
      <g clip-path="url(#clip-torse)">
        <use href="#spirale-torse" opacity="1"/>
      </g>
      <g clip-path="url(#clip-tete)">
        <use href="#spirale-tete" opacity="1"/>
      </g>

      <!-- Points d'ancrage, les deux glows actifs -->
      <circle cx="200" cy="418" r="11" fill="#FFFFFF" opacity="0.85" filter="url(#glow-doux)"/>
      <circle cx="200" cy="418" r="6" fill="#FFFFFF"/>
      <circle cx="200" cy="205" r="11" fill="#FFFFFF" opacity="0.85" filter="url(#glow-doux)"/>
      <circle cx="200" cy="205" r="6" fill="#FFFFFF"/>

      <!-- Bulles légères autour des deux zones -->
      <g opacity="0.5" fill="#FFFFFF">
        <circle cx="96" cy="130" r="3.5"/>
        <circle cx="290" cy="98" r="4"/>
        <circle cx="322" cy="175" r="3"/>
        <circle cx="70" cy="300" r="3.5"/>
        <circle cx="330" cy="300" r="4"/>
        <circle cx="60" cy="560" r="3"/>
        <circle cx="340" cy="560" r="3.5"/>
      </g>
    </svg>
    <figcaption>Éveil Complet</figcaption>
  </figure>

</div>

</body>
</html>
